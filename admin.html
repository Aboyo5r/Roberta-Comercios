<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin</title><link rel="stylesheet" href="/style.css"></head><body><main class="wrap"><header class="top"><div class="logo">Comercio <span>Robertas</span></div><b class="tag">SOLE ADMIN</b><button onclick="logout()">Sign out</button></header><section class="card"><h1>Admin Dashboard</h1><p class="muted">Manage registered demo users and simulated Wallet Balances.</p></section><div id="users"></div><section class="card"><h2>Recent audit activity</h2><div id="activity"></div></section></main><script>async function load(){let r=await fetch("/api/admin/users");if(!r.ok)return location="/login.html";let us=await r.json();users.innerHTML=us.length?us.map(u=>`<section class="card user"><div><h2>${u.name}</h2><p>${u.email}</p><p>Wallet Balance: <b>$${u.wallet_balance.toFixed(2)}</b></p><p>Simulated Profit: <b class=green>$${u.profit.toFixed(2)}</b></p></div><div><h3>Fund User Account</h3><div class=two><input id=f${u.id} type=number min=0 step=.01 placeholder="Amount"><input id=fn${u.id} placeholder="Note"></div><button onclick="fund(${u.id})">Add to Wallet</button><h3>Adjust Simulated Profit</h3><div class=two><input id=p${u.id} type=number step=.01 placeholder="+ / - amount"><input id=pn${u.id} placeholder="Note"></div><button onclick="profit(${u.id})">Update Profit</button><p><a href="/dashboard.html" target="_blank">User dashboards are protected by login.</a></p></div></section>`).join(""):"<div class=card>No users yet.</div>";let ar=await fetch("/api/admin/activity"),a=await ar.json();activity.innerHTML=a.map(x=>`<div class=activity>${x.name} (${x.email}) · ${x.note} · $${Number(x.amount).toFixed(2)}</div>`).join("")||"No activity."}async function fund(id){let r=await fetch("/api/admin/fund",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({id,amount:document.getElementById("f"+id).value,note:document.getElementById("fn"+id).value})}),d=await r.json();if(!r.ok)return alert(d.error);load()}async function profit(id){let r=await fetch("/api/admin/profit",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({id,amount:document.getElementById("p"+id).value,note:document.getElementById("pn"+id).value})}),d=await r.json();if(!r.ok)return alert(d.error);load()}async function logout(){await fetch("/api/logout",{method:"POST"});location="/login.html"}load()</script></body></html>
